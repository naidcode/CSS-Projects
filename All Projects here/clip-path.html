<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clip-path</title>
  <style>
    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box{
      height: 300px;
      width: 300px;
      background-color: red;
      clip-path: path("M 10,40 L70,40  80,10 L 90,0 L 140,0 L 150,10 L 150,190 L 140,200 L 10,200 L 0,190 L 0 50 Z");
    }

  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
