<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clip-path</title>
  <style>
   .box {
  width: 300px;
  height: 300px;
  background: red;

  -webkit-clip-path: path(
    "M 20% 0% Q 0% 0% 0% 20%L 0% 80%Q 0% 100% 20% 100%L 80% 100% Q 100% 100% 100% 80%L 100% 20%Q 100% 0% 80% 0%
     Z"
  );

  clip-path: path(
    "M 20% 0%
     Q 0% 0% 0% 20%
     L 0% 80%
     Q 0% 100% 20% 100%
     L 80% 100%
     Q 100% 100% 100% 80%
     L 100% 20%
     Q 100% 0% 80% 0%
     Z"
  );
}

    }

  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
