<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price card</title>
  <style>
    *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body{
      background-color: rgb(195, 249, 249);
    }
    .card{
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card2{
      height: 350px;
      width: 250px;
      background-color: rgba(86, 196, 204, 0.51);
      border: 0.5px solid grey;
      border-radius: 22px;
      position: absolute;
    }
    .card2 h3{
      font-size: 1.5rem;
      color: rgb(85, 81, 81);
      font-family: Arial, Helvetica, sans-serif;
     position: relative;
     top: 20px;
     left: 60px;
    }
    .card2 h5{
      font-size: 0.8em;
      color: rgb(66, 61, 61);
      font-family: Arial, Helvetica, sans-serif;
     position: relative;
     top: 25px;
     left: 70px;
    }

    ul li{
      list-style: none;
      font-size: 1rem;
      font-weight: 600;
      color: rgb(68, 59, 59);
      padding: 3px;
      font-family: Arial, Helvetica, sans-serif;
      position: relative;
      top: 35px;
      left:15px;
    }

    .button{
      position: relative;
      top: 50px;
      left:55px;
      font-size: 16px;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 500;
      padding: 10px 25px;
      border-radius: 5px;
      border: 0.5px solid grey;
      color: black;
      background-color: rgba(193, 237, 240, 0.51);
    }
    .button:hover{
      background-color: white;
    }

    @media (max-width: 750px){
      body{
        background-color: white;
      }
      .button{
        position: relative;
        left: 3px;
        padding: 10px 50px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card2">
      <h3>Basic Plan</h3>
    <h5>$39.99/months</h5>
    <ul>
      <li>fast website </li>
      <li>user friendly</li>
      <li>seo friendly</li>
      <li>form</li>
      <li>popups</li>
      <li>3 pages</li>
      <li>reponsive website</li>  
    </ul>
    <button class="button">Get Started</button>
    </div>
  </div>
</body>
</html>
