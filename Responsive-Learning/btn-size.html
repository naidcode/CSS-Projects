<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>btn-size</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body{
      height: 100vh;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    .card{
      width: 45%;
      height: 46vh;
      padding: 30px;
      background-color: black;
      /* margin:100px auto; */
    }

    .card h1{
      color: white;
      font-size: clamp(1rem, 2vw , 2em);
      padding: 30px 10px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card p{
        font-size: clamp(0.8rem, 2vw , 1em);
      font-family: Arial, Helvetica, sans-serif;
      color: white;
       padding: 10px;
    }
    .accent-color{
      color: yellow;
    }

    .anchor-color{
      color: yellow;
    }

    .button{
      padding: .5em 1.25em;
      background-color: yellow;
      color: black;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 50px;
    }
    .btn-big{
      font-size: 1.5rem;
    }

    .btn-small{
      font-size: .5rem;
    }
   
  </style>
</head>
<body>
  <div class="card">
<h1>Nisl suscipit <span class="accent-color">adipiscing bibendum</span> est ultricies
integer quis auctor.</h1>
<p>Netus et malesuada fames ac. <a href="#" class="anchor-color">Sed cras ornare arcu dui vivamus</a>.
<strong>Elementum integer enim neque</strong> volutpat ac tincidunt vitae semper.</p>
<p class="links">
<a class="button btn-big" href="#">contact me</a>
<a class="button" href="#">default</a>
<a href="#" class="button bth-small">about me</a>
</p>
</div>
</body>
</html>
